name: Update Pineau footer generator

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-generator:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Update generator
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'scripts/build-static-site.mjs';
          let html = fs.readFileSync(file, 'utf8');
          const footerBlock = Buffer.from('', 'base64').toString('utf8');
          if (!html.includes('async function updateProductFootersWithPineauBlanc()')) {
            const marker = '  await writeText(`collection/${PINEAU_ALIAS_SLUG}/index.html`, pineauBlancRedirectPage());\n}\n\nasync function updateCollectionWithPineauBlanc() {';
            const replacement = '  await writeText(`collection/${PINEAU_ALIAS_SLUG}/index.html`, pineauBlancRedirectPage());\n  await updateProductFootersWithPineauBlanc();\n}\n\n' + footerBlock + '\nasync function updateCollectionWithPineauBlanc() {';
            if (!html.includes(marker)) throw new Error('Pineau generator marker not found');
            html = html.replace(marker, replacement);
          }
          fs.writeFileSync(file, html);
          NODE
      - name: Commit generator update and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/update-pineau-generator.yml
          git add scripts/build-static-site.mjs .github/workflows/update-pineau-generator.yml
          if git diff --cached --quiet; then
            echo "No generator changes to commit"
            exit 0
          fi
          git commit -m "Update Pineau footer generator"
          git push
