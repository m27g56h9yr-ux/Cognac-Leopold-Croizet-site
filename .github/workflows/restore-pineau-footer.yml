name: Restore Pineau footer links
# Triggered again after creation so GitHub runs the repair on main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restore Pineau footer links
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const ROOT = process.cwd();
          const DEPLOY_BASE = '/Cognac-Leopold-Croizet-site';
          const PINEAU_SLUG = 'pineau-des-charentes';
          const locales = [
            { prefix: '', route: `/collection/${PINEAU_SLUG}/` },
            { prefix: 'en', route: `/en/collection/${PINEAU_SLUG}/` },
            { prefix: 'ru', route: `/ru/collection/${PINEAU_SLUG}/` },
            { prefix: 'da', route: `/da/collection/${PINEAU_SLUG}/` },
            { prefix: 'sv', route: `/sv/collection/${PINEAU_SLUG}/` },
            { prefix: 'no', route: `/no/collection/${PINEAU_SLUG}/` },
            { prefix: 'zh', route: `/zh/collection/${PINEAU_SLUG}/` },
          ];

          function removePineauProductFooterItems(html) {
            return html.replace(
              /\s*<div class="produit-unique bas-page-produit">\s*<a href="[^"]*\/collection\/pineau-des-charentes(?:-blanc)?\/"[\s\S]*?<\/div>\s*<\/div>\s*/gi,
              '\n',
            );
          }

          function pineauProductFooterItem(config) {
            const currentMarker = config.isCurrent
              ? '                                                            <div class="etoile-produit">*</div>\n'
              : '';
            return `                                <div class="produit-unique bas-page-produit">
                        <a href="${DEPLOY_BASE}${config.route}">
${currentMarker}                                                        <img src="${DEPLOY_BASE}/wp-content/uploads/2021/06/img_produit_pineau_base-1.png" alt="Pineau" srcset="${DEPLOY_BASE}/wp-content/uploads/2021/06/img_produit_pineau_base-1.png 0.5x, ${DEPLOY_BASE}/wp-content/uploads/2021/06/img_produit_pineau_base-1.png 5x, ${DEPLOY_BASE}/wp-content/uploads/2021/06/img_produit_pineau_base-1.png 2x, ${DEPLOY_BASE}/wp-content/uploads/2021/06/img_produit_pineau_base-1.png 3x">
                            <div class="titre-produit">Pineau</div>
                        </a>
                    </div>
`;
          }

          function addPineauProductFooterItem(html, config) {
            if (!html.includes('container-produits')) return html;
            return html.replace(
              /(<div class="produit-unique bas-page-produit">\s*<a href="[^"]*\/collection\/valentine\/"[\s\S]*?<\/div>\s*<\/div>)/i,
              `$1\n${pineauProductFooterItem(config)}`,
            );
          }

          let updated = 0;
          for (const locale of locales) {
            const collectionDir = locale.prefix ? path.join(ROOT, locale.prefix, 'collection') : path.join(ROOT, 'collection');
            if (!fs.existsSync(collectionDir)) continue;
            for (const slug of fs.readdirSync(collectionDir)) {
              const file = path.join(collectionDir, slug, 'index.html');
              if (!fs.existsSync(file)) continue;
              const html = fs.readFileSync(file, 'utf8');
              if (!html.includes('container-produits') || !html.includes('/collection/valentine/')) continue;
              const next = addPineauProductFooterItem(removePineauProductFooterItems(html), {
                route: locale.route,
                isCurrent: slug === PINEAU_SLUG,
              });
              if (next !== html) {
                fs.writeFileSync(file, next);
                updated += 1;
              }
            }
          }

          console.log(`Updated ${updated} product footers`);
          NODE
      - name: Commit restored pages and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/restore-pineau-footer.yml
          git add collection en/collection ru/collection da/collection sv/collection no/collection zh/collection .github/workflows/restore-pineau-footer.yml
          if git diff --cached --quiet; then
            echo "No page changes to commit"
            exit 0
          fi
          git commit -m "Restore Pineau footer links"
          git push
