name: Deploy OVH

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ovh-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, check and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Verify committed static site files
        shell: bash
        run: |
          set -euo pipefail

          test -f index.html
          test -f sitemap.xml
          test -f robots.txt

      - name: Check static site
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y php-cli php-sqlite3
          php -l api/newsletter.php
          php -l api/newsletter-lib.php
          php -l scripts/test-newsletter-endpoint.php
          newsletter_test_dir="$(mktemp -d)"
          LC_NEWSLETTER_STORAGE_PATH="$newsletter_test_dir/subscriptions.csv" \
            php scripts/test-newsletter-endpoint.php normal > "$newsletter_test_dir/normal.json"
          LC_NEWSLETTER_STORAGE_PATH="$newsletter_test_dir/subscriptions.csv" \
            php scripts/test-newsletter-endpoint.php duplicate > "$newsletter_test_dir/duplicate.json"
          LC_NEWSLETTER_STORAGE_PATH="$newsletter_test_dir/subscriptions.csv" \
            php scripts/test-newsletter-endpoint.php honeypot > "$newsletter_test_dir/honeypot.json"
          LC_NEWSLETTER_STORAGE_PATH="$newsletter_test_dir/subscriptions.csv" \
            php scripts/test-newsletter-endpoint.php concurrent > "$newsletter_test_dir/concurrent-1.json" &
          newsletter_pid_1=$!
          LC_NEWSLETTER_STORAGE_PATH="$newsletter_test_dir/subscriptions.csv" \
            php scripts/test-newsletter-endpoint.php concurrent > "$newsletter_test_dir/concurrent-2.json" &
          newsletter_pid_2=$!
          wait "$newsletter_pid_1"
          wait "$newsletter_pid_2"
          LC_NEWSLETTER_STORAGE_PATH="$newsletter_test_dir/subscriptions.csv" \
          LC_NEWSLETTER_RISK_LOG_PATH="$newsletter_test_dir" \
            php scripts/test-newsletter-endpoint.php risk_log_failure > "$newsletter_test_dir/risk-log-failure.json"
          for response in "$newsletter_test_dir"/*.json; do
            grep -F '"ok":true' "$response"
          done
          grep -F '"status":"already_registered"' "$newsletter_test_dir/duplicate.json"
          grep -F 'honeypot_filled' "$newsletter_test_dir/submission-risk.csv"
          if grep -Eq 'person@example\.com|observed@example\.com|concurrent@example\.com|192\.0\.2\.10' "$newsletter_test_dir/submission-risk.csv"; then
            echo "::error::Newsletter risk log contains personal test data"
            exit 1
          fi
          test "$(wc -l < "$newsletter_test_dir/subscriptions.csv")" -eq 5
          test "$(grep -c 'person@example.com' "$newsletter_test_dir/subscriptions.csv")" -eq 1
          test "$(grep -c 'concurrent@example.com' "$newsletter_test_dir/subscriptions.csv")" -eq 1
          test "$(grep -c 'riskfail@example.com' "$newsletter_test_dir/subscriptions.csv")" -eq 1
          rm -rf "$newsletter_test_dir"
          php -l api/conversion.php
          php -l scripts/test-conversion-endpoint.php
          conversion_test_dir="$(mktemp -d)"
          LC_CONVERSION_STORAGE_PATH="$conversion_test_dir/conversions.csv" \
            php scripts/test-conversion-endpoint.php > "$conversion_test_dir/response.json"
          grep -F '"status":"recorded"' "$conversion_test_dir/response.json"
          test "$(wc -l < "$conversion_test_dir/conversions.csv")" -eq 2
          grep -F 'contact_clicked' "$conversion_test_dir/conversions.csv"
          grep -F ',google' "$conversion_test_dir/conversions.csv"
          rm -rf "$conversion_test_dir"
          php -l api/partner-offers-lib.php
          php -l api/partner-offers.php
          php -l suivi-vendeurs-data.php
          php -l api/salon-lib.php
          php -l api/salon-contact.php
          php -l api/salon-admin.php
          python3 scripts/test-salon-endpoint.py
          node scripts/build-salon-page.mjs
          git diff --exit-code -- salon/index.html salon/desinscription/index.html se-retrouver/index.html se-retrouver/desinscription/index.html se-retrouver/.htaccess
          npm run check

      - name: Prepare deployment bundle
        shell: bash
        run: |
          set -euo pipefail

          rm -rf _deploy
          mkdir -p _deploy

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='_deploy/' \
            --exclude='_preview/' \
            --exclude='node_modules/' \
            --exclude='scripts/' \
            --exclude='outputs/' \
            --exclude='tmp/' \
            --exclude='*.md' \
            --exclude='README.md' \
            --exclude='AUDIT.md' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='npm-shrinkwrap.json' \
            --exclude='yarn.lock' \
            --exclude='pnpm-lock.yaml' \
            --exclude='newsletter-data/' \
            --exclude='conversion-data/' \
            --exclude='partner-data/' \
            --exclude='api/newsletter-config.php' \
            --exclude='api/conversion-config.php' \
            --exclude='api/salon-config.php' \
            --exclude='.htpasswd' \
            --exclude='.user.ini' \
            --exclude='php.ini' \
            --exclude='wp-config.php' \
            --exclude='config.php' \
            --exclude='config.*' \
            --exclude='*.config.*' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='*.env' \
            --exclude='*.local' \
            --exclude='*.pem' \
            --exclude='*.key' \
            --exclude='id_rsa*' \
            --exclude='config.private.*' \
            --exclude='*.private.*' \
            ./ _deploy/

          blocked_path="$(find _deploy \( \
            -name '.git' -o \
            -name '.github' -o \
            -name 'newsletter-data' -o \
            -name 'conversion-data' -o \
            -name 'partner-data' -o \
            -name 'newsletter-config.php' -o \
            -name 'conversion-config.php' -o \
            -name 'salon-config.php' -o \
            -name '.htpasswd' -o \
            -name '.user.ini' -o \
            -name 'php.ini' -o \
            -name 'wp-config.php' -o \
            -name 'config.php' -o \
            -name 'config.*' -o \
            -name '*.config.*' -o \
            -name '.env' -o \
            -name '.env.*' -o \
            -name '*.env' -o \
            -name '*.local' -o \
            -name '*.pem' -o \
            -name '*.key' -o \
            -name 'id_rsa*' -o \
            -name 'config.private.*' -o \
            -name '*.private.*' \
          \) -print -quit)"

          if [ -n "$blocked_path" ]; then
            echo "::error::Sensitive file included in deployment bundle: $blocked_path"
            exit 1
          fi

          {
            echo "commit=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "deployed_at_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > _deploy/deploy-version.txt

      - name: Install SFTP client
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Verify historical WordPress before publication
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 https://ancien.cognac-leopold-croizet.com/wp-json/ > /tmp/lc-historical-wp.json
          python3 - <<'PYWP'
          import json
          with open('/tmp/lc-historical-wp.json') as f: wp = json.load(f)
          assert 'wp/v2' in wp.get('namespaces', []) and wp.get('routes'), 'Historical WordPress is not available'
          assert wp.get('url', '').startswith('https://ancien.cognac-leopold-croizet.com'), 'Unexpected historical WordPress host'
          print('Historical WordPress is available over verified HTTPS.')
          PYWP

      - name: Prepare private salon administrator access
        env:
          SALON_ADMIN_TOKEN: ${{ secrets.LC_SALON_ADMIN_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCONFIG'
          import hashlib, os, pathlib, re
          token = os.environ.get('SALON_ADMIN_TOKEN', '')
          assert re.fullmatch('[a-f0-9]{64}', token), 'Missing valid LC_SALON_ADMIN_TOKEN secret'
          config = pathlib.Path('/tmp/lc-salon-config.php')
          config.write_text("<?php\nreturn ['admin_token_hash' => '" + hashlib.sha256(token.encode()).hexdigest() + "'];\n")
          config.chmod(0o600)
          PYCONFIG

      - name: Deploy to OVH by SFTP
        env:
          SFTP_HOST: ${{ secrets.OVH_SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.OVH_SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.OVH_SFTP_PASSWORD }}
          SFTP_TARGET_DIR: ${{ secrets.OVH_SFTP_TARGET_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          : "${SFTP_HOST:?Missing GitHub secret OVH_SFTP_HOST}"
          : "${SFTP_USERNAME:?Missing GitHub secret OVH_SFTP_USERNAME}"
          : "${SFTP_PASSWORD:?Missing GitHub secret OVH_SFTP_PASSWORD}"
          : "${SFTP_TARGET_DIR:?Missing GitHub secret OVH_SFTP_TARGET_DIR}"

          if [ "$SFTP_TARGET_DIR" != "." ]; then
            echo "::error::OVH_SFTP_TARGET_DIR must be '.' because the OVH SFTP user already opens in www/site-pc-new."
            exit 1
          fi

          # One-time transition: the previous endpoint locks the CSV inode itself.
          # Drain old requests before the new writer starts using atomic replacement.
          LFTP_PASSWORD="$SFTP_PASSWORD" lftp --env-password -u "$SFTP_USERNAME" "sftp://$SFTP_HOST:22" <<LFTP_READ
          set cmd:fail-exit yes
          set net:timeout 30
          set net:max-retries 3
          set sftp:auto-confirm yes
          get "$SFTP_TARGET_DIR/api/newsletter.php" -o /tmp/lc-previous-newsletter.php
          bye
          LFTP_READ
          if grep -q 'function append_local_record(' /tmp/lc-previous-newsletter.php; then
            python3 - <<'PYPAUSE'
          from pathlib import Path
          Path('/tmp/lc-newsletter-pause.php').write_text("""<?php\nhttp_response_code(503);\nheader("Content-Type: application/json; charset=utf-8");\nheader("Cache-Control: no-store");\nheader("Retry-After: 60");\necho '{"ok":false,"status":"temporarily_unavailable"}';\n""")
          PYPAUSE
            LFTP_PASSWORD="$SFTP_PASSWORD" lftp --env-password -u "$SFTP_USERNAME" "sftp://$SFTP_HOST:22" <<LFTP_PAUSE
          set cmd:fail-exit yes
          set net:timeout 30
          set net:max-retries 3
          set sftp:auto-confirm yes
          put /tmp/lc-newsletter-pause.php -o "$SFTP_TARGET_DIR/api/newsletter.php"
          bye
          LFTP_PAUSE
            echo "Legacy newsletter submissions paused; draining existing CSV writers."
            sleep 60
          fi
          rm -f /tmp/lc-previous-newsletter.php /tmp/lc-newsletter-pause.php

          LFTP_PASSWORD="$SFTP_PASSWORD" lftp --env-password -u "$SFTP_USERNAME" "sftp://$SFTP_HOST:22" <<LFTP_COMMANDS
          set cmd:fail-exit yes
          set net:timeout 30
          set net:max-retries 3
          set net:reconnect-interval-base 5
          set sftp:auto-confirm yes
          put /tmp/lc-salon-config.php -o "$SFTP_TARGET_DIR/api/salon-config.php"
          chmod 600 "$SFTP_TARGET_DIR/api/salon-config.php"
          rm -f "$SFTP_TARGET_DIR/api/salon-config.php.new"
          mirror --reverse --delete --verbose --parallel=4 \
            --exclude '(^|/)newsletter-data(/|$)' \
            --exclude '(^|/)conversion-data(/|$)' \
            --exclude '(^|/)partner-data(/|$)' \
            --exclude '(^|/)api/newsletter-config\.php$' \
            --exclude '(^|/)api/conversion-config\.php$' \
            --exclude '(^|/)api/salon-config\.php$' \
            --exclude '(^|/)\.htpasswd$' \
            --exclude '(^|/)\.user\.ini$' \
            --exclude '(^|/)php\.ini$' \
            --exclude '(^|/)wp-config\.php$' \
            --exclude '(^|/)config\.php$' \
            --exclude '(^|/)config\..*$' \
            --exclude '(^|/).*\.config\..*$' \
            --exclude '(^|/)\.env(\..*)?$' \
            --exclude '(^|/).*\.env$' \
            --exclude '(^|/).*\.local$' \
            --exclude '(^|/).*\.pem$' \
            --exclude '(^|/).*\.key$' \
            --exclude '(^|/)id_rsa.*$' \
            --exclude '(^|/).*private.*$' \
            _deploy/ "$SFTP_TARGET_DIR"
          bye
          LFTP_COMMANDS
          rm -f /tmp/lc-salon-config.php

      - name: Verify production pages
        shell: bash
        run: |
          set -euo pipefail

          fetch() {
            curl --location --silent --show-error \
              --header "Cache-Control: no-cache" \
              --header "Pragma: no-cache" \
              --retry 3 \
              --retry-all-errors \
              --connect-timeout 10 \
              --max-time 30 \
              "$1"
          }

          urls=(
            "https://cognac-leopold-croizet.com/"
            "https://cognac-leopold-croizet.com/rencontre/"
            "https://cognac-leopold-croizet.com/mentions-legales/"
            "https://cognac-leopold-croizet.com/se-retrouver/"
            "https://cognac-leopold-croizet.com/se-retrouver/desinscription/"
          )

          for url in "${urls[@]}"; do
            status_code="$(curl --location --silent --show-error --output /dev/null --write-out '%{http_code}' --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 "$url")"
            if [ "$status_code" -lt 200 ] || [ "$status_code" -ge 400 ]; then
              echo "::error::$url returned HTTP $status_code"
              exit 1
            fi
            echo "$url returned HTTP $status_code"
          done

          version_url="https://cognac-leopold-croizet.com/deploy-version.txt?v=$GITHUB_SHA"
          version_body="$(fetch "$version_url")"
          if ! grep -q "commit=$GITHUB_SHA" <<< "$version_body"; then
            echo "::error::The deployed commit marker is not visible on production. OVH may be serving a cached page or the workflow may be deploying to the wrong directory."
            echo "Expected commit=$GITHUB_SHA at $version_url"
            echo "Received:"
            echo "$version_body"
            exit 1
          fi
          echo "Production exposes deploy-version.txt for commit $GITHUB_SHA"

          home_html="$(fetch "https://cognac-leopold-croizet.com/?v=$GITHUB_SHA")"
          rencontre_html="$(fetch "https://cognac-leopold-croizet.com/rencontre/?v=$GITHUB_SHA")"
          mentions_html="$(fetch "https://cognac-leopold-croizet.com/mentions-legales/?v=$GITHUB_SHA")"

          forbidden_home=(
            "cognac-pierre-croizet.com"
            "en.cognac-leopold-croizet.com"
            "ru.cognac-leopold-croizet.com"
            "cognacg.cluster028.hosting.ovh.net"
            "Cognac-Leopold-Croizet-site"
          )
          for forbidden in "${forbidden_home[@]}"; do
            if grep -q "$forbidden" <<< "$home_html"; then
              echo "::error::Production homepage still contains legacy reference: $forbidden"
              exit 1
            fi
          done

          if ! grep -q "30 Rue d" <<< "$rencontre_html"; then
            echo "::error::Production /rencontre/ does not contain the new address: 30 Rue d'Angoulême."
            exit 1
          fi
          if grep -q "30 Route d" <<< "$rencontre_html"; then
            echo "::error::Production /rencontre/ still contains the old address: 30 Route d'Angoulême."
            exit 1
          fi

          if grep -q "www.leopold-croizet.com" <<< "$mentions_html"; then
            echo "::error::Production /mentions-legales/ still contains www.leopold-croizet.com."
            exit 1
          fi

          fetch "https://cognac-leopold-croizet.com/api/salon-contact.php?action=health" > /tmp/lc-salon-health.json
          python3 - <<'PYHEALTH'
          import json
          with open('/tmp/lc-salon-health.json') as f: health = json.load(f)
          assert health.get('ok') and health.get('status') == 'ready', 'Salon private storage is unavailable'
          print('Salon collection and private storage are ready.')
          PYHEALTH
          for protected in api/salon-config.php api/salon-lib.php api/newsletter-config.php api/newsletter-lib.php newsletter-data/subscriptions.csv; do
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "https://cognac-leopold-croizet.com/$protected")"
            test "$status" = '403'
          done
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' https://cognac-leopold-croizet.com/api/salon-admin.php)"
          test "$status" = '401'
          echo "Production content checks passed for the current commit."
