name: Apply VSOP AV link

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply VSOP link
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          av_link = 'https://av.ru/i/174054'

          product_path = Path('ru/collection/vsop/index.html')
          product = product_path.read_text(encoding='utf-8')
          product = re.sub(
              r'href="[^"]*"\s+class=" btn-commander-produit">Заказать</a>',
              f'href="{av_link}" class=" btn-commander-produit">Заказать</a>',
              product,
              count=1,
          )
          product_path.write_text(product, encoding='utf-8')

          script_path = Path('scripts/build-static-site.mjs')
          script = script_path.read_text(encoding='utf-8')
          if 'function applyRussianOrderLinks(html, route)' not in script:
              script = script.replace(
                  '  return removeRussianPrices(applyRussianSeo(localized, route));\n}',
                  '  return applyRussianOrderLinks(removeRussianPrices(applyRussianSeo(localized, route)), route);\n}',
              )
              script = script.replace(
                  'function applyRussianSeo(html, route) {',
                  f'''function applyRussianOrderLinks(html, route) {{
  const orderLinks = new Map([
    ['/ru/collection/vsop/', '{av_link}'],
  ]);
  const orderLink = orderLinks.get(route);
  if (!orderLink) return html;

  return html.replace(
    /href="[^"]*"\\s+class=" btn-commander-produit"/,
    `href="${{orderLink}}" class=" btn-commander-produit"`,
  );
}}

function applyRussianSeo(html, route) {{''',
                  1,
              )
          else:
              script = script.replace("'/ru/collection/vsop/', 'https://av.ru/i/174054'", "'/ru/collection/vsop/', 'https://av.ru/i/174054'")
          script_path.write_text(script, encoding='utf-8')

          Path('.github/workflows/apply-vsop-av-link.yml').unlink(missing_ok=True)
          PY
      - name: Commit VSOP link
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Link Russian VSOP order button to AV"
            git push
          fi
