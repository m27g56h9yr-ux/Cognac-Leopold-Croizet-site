name: Apply contact and Russian price fix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply cleanup
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          text_suffixes = {'.html', '.js', '.mjs', '.css', '.txt', '.xml', '.json', '.md', '.yml', '.yaml'}
          old_emails = ('contact@mdpierre.com', 'cognac@mdpierre.com')
          new_email = 'cognac@mdpierrre.com'
          price_re = re.compile(r'\s*<div class="prix-produit-(?:collection|container)">\s*<span>[0-9\s.,]+</span>\s*€\s*</div>\s*', re.S)
          script_marker = 'function removeRussianPrices(html)'

          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              if path.suffix.lower() not in text_suffixes and path.name != 'llms.txt':
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue

              updated = text
              for old_email in old_emails:
                  updated = updated.replace(old_email, new_email)

              posix = path.as_posix()
              if posix.startswith('ru/') and path.suffix.lower() == '.html':
                  updated = price_re.sub('\n', updated)

              if posix == 'scripts/build-static-site.mjs' and script_marker not in updated:
                  updated = updated.replace(
                      '  return applyRussianSeo(localized, route);\n}\n\nfunction applyRussianSeo(html, route) {',
                      '  return removeRussianPrices(applyRussianSeo(localized, route));\n}\n\nfunction removeRussianPrices(html) {\n  return html\n    .replace(/\\s*<div class="prix-produit-collection">\\s*<span>[0-9\\s.,]+<\\/span>\\s*€\\s*<\\/div>\\s*/g, \'\\n\')\n    .replace(/\\s*<div class="prix-produit-container">\\s*<span>[0-9\\s.,]+<\\/span>\\s*€\\s*<\\/div>\\s*/g, \'\\n\');\n}\n\nfunction applyRussianSeo(html, route) {'
                  )

              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          Path('.github/workflows/apply-contact-price-fix.yml').unlink(missing_ok=True)
          PY
      - name: Commit cleanup
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Update contact email and hide Russian prices"
            git push
          fi
